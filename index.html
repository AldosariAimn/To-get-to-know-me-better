<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حتى تعرفني أكثر 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6f0;
    --warm: #f5ede0;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --deep: #2c1f14;
    --mid: #6b4c35;
    --soft: #a07850;
    --rose: #d4846a;
    --green: #6a9e7a;
    --border: #e2d5c3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Tajawal', sans-serif;
    color: var(--deep);
    min-height: 100vh;
  }

  /* Decorative background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 10% 20%, rgba(201,169,110,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(212,132,106,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 48px 0 36px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .header-ornament {
    font-family: 'Amiri', serif;
    font-size: 28px;
    color: var(--gold);
    margin-bottom: 12px;
    letter-spacing: 8px;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 800;
    color: var(--deep);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--soft);
    font-size: 15px;
    font-weight: 300;
  }

  /* Role selector */
  .role-section {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 36px;
    box-shadow: 0 2px 20px rgba(44,31,20,0.04);
  }

  .role-section h2 {
    font-size: 17px;
    font-weight: 700;
    color: var(--mid);
    margin-bottom: 20px;
    text-align: center;
  }

  .role-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .role-btn {
    padding: 14px 32px;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: white;
    font-family: 'Tajawal', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--mid);
    cursor: pointer;
    transition: all 0.2s;
  }

  .role-btn:hover { border-color: var(--gold); color: var(--deep); }
  .role-btn.active {
    background: var(--deep);
    border-color: var(--deep);
    color: white;
  }

  .name-input-wrap {
    margin-top: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .name-input-wrap.visible { display: flex; }

  .name-input-wrap label {
    font-size: 14px;
    color: var(--soft);
  }

  .name-input-wrap input {
    width: 280px;
    padding: 12px 20px;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    font-family: 'Tajawal', sans-serif;
    font-size: 16px;
    text-align: center;
    color: var(--deep);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
  }

  .name-input-wrap input:focus { border-color: var(--gold); }

  /* Sections */
  .section-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(44,31,20,0.04);
    transition: box-shadow 0.2s;
  }

  .section-card:hover { box-shadow: 0 4px 30px rgba(44,31,20,0.08); }

  .section-header {
    padding: 24px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .section-header.open { border-color: var(--border); }

  .section-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: var(--warm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .section-title { flex: 1; }
  .section-title h3 { font-size: 17px; font-weight: 700; color: var(--deep); }
  .section-title p { font-size: 13px; color: var(--soft); margin-top: 2px; }

  .section-progress {
    font-size: 12px;
    color: var(--gold);
    font-weight: 600;
  }

  .chevron {
    width: 20px;
    height: 20px;
    color: var(--soft);
    transition: transform 0.3s;
  }

  .section-header.open .chevron { transform: rotate(180deg); }

  .section-body {
    display: none;
    padding: 24px 28px;
  }

  .section-body.open { display: block; }

  /* Questions */
  .question {
    margin-bottom: 28px;
  }

  .question:last-child { margin-bottom: 0; }

  .question-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--deep);
    margin-bottom: 10px;
    line-height: 1.6;
    display: flex;
    gap: 10px;
  }

  .question-num {
    width: 26px;
    height: 26px;
    background: var(--warm);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--soft);
    flex-shrink: 0;
    margin-top: 1px;
  }

  textarea {
    width: 100%;
    min-height: 100px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    color: var(--deep);
    background: var(--cream);
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.7;
  }

  textarea:focus { border-color: var(--gold); background: white; }

  /* Checkbox group */
  .checkbox-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }

  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--cream);
  }

  .checkbox-item:hover { border-color: var(--gold-light); background: white; }
  .checkbox-item.checked { border-color: var(--gold); background: #fdf8f0; }

  .checkbox-item input { display: none; }
  .checkmark {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

  .checkbox-item.checked .checkmark {
    background: var(--gold);
    border-color: var(--gold);
    color: white;
  }

  .checkbox-item span { font-size: 14px; color: var(--deep); }

  /* Save button */
  .save-section {
    text-align: center;
    padding: 40px 0 20px;
  }

  .save-btn {
    background: var(--deep);
    color: white;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-family: 'Tajawal', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(44,31,20,0.2);
  }

  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(44,31,20,0.3); }
  .save-btn:active { transform: translateY(0); }

  /* View toggle */
  .view-toggle {
    display: flex;
    gap: 8px;
    background: var(--warm);
    border-radius: 50px;
    padding: 4px;
    margin-bottom: 32px;
    width: fit-content;
    margin-inline: auto;
  }

  .toggle-btn {
    padding: 10px 24px;
    border-radius: 50px;
    border: none;
    background: transparent;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--soft);
    cursor: pointer;
    transition: all 0.2s;
  }

  .toggle-btn.active {
    background: white;
    color: var(--deep);
    box-shadow: 0 2px 8px rgba(44,31,20,0.1);
  }

  /* Compare view */
  .compare-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(44,31,20,0.04);
  }

  .compare-section-title {
    padding: 18px 24px;
    background: var(--warm);
    font-size: 15px;
    font-weight: 700;
    color: var(--mid);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .compare-question {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .compare-question:last-child { border-bottom: none; }

  .compare-q-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--deep);
    margin-bottom: 14px;
    line-height: 1.6;
  }

  .compare-answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .answer-box {
    border-radius: 14px;
    padding: 14px;
    border: 1.5px solid;
  }

  .answer-box.person1 { border-color: #e8d5b0; background: #fdf8f0; }
  .answer-box.person2 { border-color: #f5c6bc; background: #fdf5f3; }

  .answer-name {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .answer-box.person1 .answer-name { color: var(--gold); }
  .answer-box.person2 .answer-name { color: var(--rose); }

  .answer-text {
    font-size: 14px;
    color: var(--deep);
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .no-answer { color: var(--soft); font-style: italic; font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--deep);
    color: white;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    z-index: 1000;
    transition: transform 0.3s ease;
    text-align: center;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media (max-width: 540px) {
    .compare-answers { grid-template-columns: 1fr; }
    .header h1 { font-size: 26px; }
    .section-header { padding: 18px 20px; }
    .section-body { padding: 18px 20px; }
  }

  .hidden { display: none !important; }

  .share-box {
    background: white;
    border: 1.5px solid var(--gold-light);
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: 0 2px 20px rgba(44,31,20,0.04);
  }

  .share-box h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--mid);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .code-display {
    background: var(--warm);
    border-radius: 12px;
    padding: 14px 18px;
    font-family: monospace;
    font-size: 13px;
    color: var(--deep);
    word-break: break-all;
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .share-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .share-btn {
    padding: 10px 20px;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: white;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--mid);
    cursor: pointer;
    transition: all 0.2s;
  }

  .share-btn:hover { border-color: var(--gold); color: var(--deep); }
  .share-btn.primary { background: var(--deep); color: white; border-color: var(--deep); }

  .import-wrap {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: none;
  }

  .import-wrap.visible { display: block; }

  .import-wrap label { font-size: 13px; color: var(--soft); display: block; margin-bottom: 8px; }

  .import-row { display: flex; gap: 8px; }

  .import-input {
    flex: 1;
    padding: 10px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: monospace;
    font-size: 13px;
    color: var(--deep);
    background: var(--cream);
    outline: none;
  }

  .import-input:focus { border-color: var(--gold); }
    background: #f0f7f2;
    border: 1px solid #b8d9c4;
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 14px;
    color: var(--green);
    margin-bottom: 28px;
    line-height: 1.7;
    text-align: center;
  }

  .saved-badge {
    display: inline-block;
    background: var(--green);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 50px;
    margin-right: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-ornament">❧ ✦ ❧</div>
    <h1>حتى تعرفني أكثر 💛</h1>
    <p>أجب على الأسئلة بصدق، ثم شاركا الإجابات مع بعض وناقشاها</p>
  </div>

  <!-- Role & Name -->
  <div class="role-section">
    <h2>أنت من؟</h2>
    <div class="role-buttons">
      <button class="role-btn" onclick="selectRole('person1')" id="btn-p1">الخطيب 💙</button>
      <button class="role-btn" onclick="selectRole('person2')" id="btn-p2">الخطيبة 🌸</button>
    </div>
  </div>

  <!-- Share section -->
  <div id="share-section" style="display:none; margin-bottom:28px;">
  </div>

  <!-- View toggle -->
  <div class="view-toggle" id="view-toggle" style="display:none">
    <button class="toggle-btn active" onclick="switchView('fill')" id="toggle-fill">أجاوب ✏️</button>
    <button class="toggle-btn" onclick="switchView('compare')" id="toggle-compare">نقارن الإجابات 👀</button>
  </div>

  <!-- Fill mode -->
  <div id="fill-view"></div>

  <!-- Compare mode -->
  <div id="compare-view" class="hidden"></div>

  <div class="save-section" id="save-section" style="display:none">
    <button class="save-btn" onclick="saveAnswers()">💾 حفظ إجاباتي</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
const sections = [

      { id: 'f2', type: 'text', text: 'ما مقدار التواصل والتدخل الذي تتوقعه أو تريده من أهل الطرف الآخر؟ هل تفضل القرب أم الاستقلالية كقاعدة عامة؟' },

      { id: 'f7', type: 'text', text: 'كيف تتخيل العلاقة الزوجية بين والدة الزوجة ووالد الزوج لو تزوجا؟' },

  },
  {

  },
  {
    id: 'conflict',
    icon: '🌊',
    title: 'الخلاف والجرح والمصالحة',
    desc: 'كيف تتعاملان مع الخلافات',
    questions: [
      {

let currentRole = null;

// ===== JSONBIN API =====
const JSONBIN_KEY = '$2a$10$djAP1AYEicaZLWkdTTlzz.t0mj5rlzlKvaMugu0Fi82lNz7O/Uj7W';
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';
let binId = null;

async function ensureBin() {
  // Store bin ID in localStorage so we always use the same bin
  if (binId) return binId;
  binId = localStorage.getItem('questionnaire_bin_id');
  if (binId) return binId;

  // Create new bin
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY,
        'X-Bin-Name': 'questionnaire-aiman-lateefa',
        'X-Bin-Private': 'true'
      },
      body: JSON.stringify({ person1: {}, person2: {} })
    });
    const data = await res.json();
    binId = data.metadata.id;
    localStorage.setItem('questionnaire_bin_id', binId);
    return binId;
  } catch { return null; }
}

async function cloudGet() {
  try {
    const id = await ensureBin();
    if (!id) return null;
    const res = await fetch(`${JSONBIN_URL}/${id}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    return data.record || null;
  } catch { return null; }
}

async function cloudSet(role, answers) {
  try {
    const id = await ensureBin();
    if (!id) return;
    // Get current data first
    const current = await cloudGet() || { person1: {}, person2: {} };
    current[role] = answers;
    await fetch(`${JSONBIN_URL}/${id}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify(current)
    });
  } catch {}
}

// Share bin ID with partner
function getBinShareCode() {
  return localStorage.getItem('questionnaire_bin_id') || '';
}

async function importBinCode(code) {
  const clean = code.trim();
  if (!clean) return false;
  // Verify it works
  try {
    const res = await fetch(`${JSONBIN_URL}/${clean}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!res.ok) return false;
    binId = clean;
    localStorage.setItem('questionnaire_bin_id', clean);
    return true;
  } catch { return false; }
}

async function selectRole(role) {
  currentRole = role;
  document.getElementById('btn-p1').classList.toggle('active', role === 'person1');
  document.getElementById('btn-p2').classList.toggle('active', role === 'person2');

  showToast('⏳ جاري تحميل الإجابات...');

  const data = await cloudGet();
  if (data) {
    cachedAnswers.person1 = data.person1 || {};
    cachedAnswers.person2 = data.person2 || {};
  }

  showToast('✅ تم التحميل');

  document.getElementById('view-toggle').style.display = 'flex';
  document.getElementById('save-section').style.display = 'block';

  // Show share code UI
  renderShareSection();
  renderFillView();
  if (currentView === 'compare') renderCompareView();
}

function saveName() {
  userName = document.getElementById('user-name').value;
}

async function saveAnswers() {
  if (!currentRole) { showToast('اختر دورك أولاً'); return; }

  showToast('⏳ جاري الحفظ...');

  const answers = {};
  sections.forEach(sec => {
    sec.questions.forEach(q => {
      if (q.type === 'checkbox') {
        const checked = [];
        document.querySelectorAll(`[data-qid="${q.id}"].checked`).forEach(el => {
          checked.push(el.dataset.option);
        });
        answers[q.id] = checked;
      } else {
        const el = document.getElementById('ans_' + q.id);
        if (el) answers[q.id] = el.value;
      }
    });
  });

  await cloudSet(currentRole, answers);
  cachedAnswers[currentRole] = answers;
  showToast('✅ تم الحفظ! لطيفة تقدر تشوف إجاباتك الآن');
}

function loadAnswers(role) {
  return cachedAnswers[role] || {};
}

// ===== RENDER FILL =====
function renderFillView() {
  const container = document.getElementById('fill-view');
  if (!currentRole) { container.innerHTML = ''; return; }

  const savedAnswers = loadAnswers(currentRole);

  let html = '';
  html += `<div class="info-banner">
    أجب على الأسئلة بصدق واضغط حفظ 🌿<br>إجاباتك تُحفظ في السحابة ويقدر الطرف الآخر يشوفها من جهازه
  </div>`;

  sections.forEach((sec, si) => {
    const answeredCount = sec.questions.filter(q => {
      const a = savedAnswers[q.id];
      return a && (Array.isArray(a) ? a.length > 0 : a.trim().length > 0);
    }).length;

    html += `<div class="section-card">
      <div class="section-header" onclick="toggleSection('sec${si}')" id="sh_sec${si}">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-title">
          <h3>${sec.title}</h3>
          <p>${sec.desc}</p>
        </div>
        <span class="section-progress">${answeredCount}/${sec.questions.length}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6,9 12,15 18,9"/>
        </svg>
      </div>
      <div class="section-body" id="sec${si}">`;

    sec.questions.forEach((q, qi) => {
      const savedVal = savedAnswers[q.id];
      html += `<div class="question">
        <div class="question-label">
          <div class="question-num">${qi + 1}</div>
          <span>${q.text}</span>
        </div>`;

      if (q.type === 'checkbox') {
        html += `<div class="checkbox-group">`;
        q.options.forEach(opt => {
          const isChecked = savedVal && savedVal.includes(opt);
          html += `<label class="checkbox-item${isChecked ? ' checked' : ''}" data-qid="${q.id}" data-option="${opt}" onclick="toggleCheck(this)">
            <div class="checkmark">${isChecked ? '✓' : ''}</div>
            <span>${opt}</span>
          </label>`;
        });
        html += `</div>`;
      } else {
        html += `<textarea id="ans_${q.id}" placeholder="اكتب إجابتك هنا...">${savedVal || ''}</textarea>`;
      }

      html += `</div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function toggleSection(id) {
  const body = document.getElementById(id);
  const header = document.getElementById('sh_' + id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  header.classList.toggle('open', !isOpen);
}

function toggleCheck(el) {
  el.classList.toggle('checked');
  el.querySelector('.checkmark').textContent = el.classList.contains('checked') ? '✓' : '';
}

// ===== RENDER COMPARE =====
function renderCompareView() {
  const container = document.getElementById('compare-view');
  const ans1 = loadAnswers('person1');
  const ans2 = loadAnswers('person2');
  const name1 = 'الخطيب';
  const name2 = 'الخطيبة';

  const has1 = Object.keys(ans1).length > 0;
  const has2 = Object.keys(ans2).length > 0;

  if (!has1 && !has2) {
    container.innerHTML = `<div class="info-banner" style="background:#fff8f0;border-color:#f5c6bc;color:#c06040;">
      لم يُجب أحد بعد. يجب أن يُجيب كلاكما على الأسئلة ثم تحفظان الإجابات أولاً.
    </div>`;
    return;
  }

  let html = `<div class="info-banner">
    <span class="saved-badge" style="background:var(--gold)">${has1 ? '✓' : '○'} ${name1}</span>
    <span class="saved-badge" style="background:var(--rose)">${has2 ? '✓' : '○'} ${name2}</span>
    <br>ناقشا الإجابات بهدوء وانفتاح 💬
  </div>`;

  sections.forEach(sec => {
    html += `<div class="compare-card">
      <div class="compare-section-title">${sec.icon} ${sec.title}</div>`;

    sec.questions.forEach((q, qi) => {
      const a1 = ans1[q.id];
      const a2 = ans2[q.id];
      const hasAny = (a1 && (Array.isArray(a1) ? a1.length : a1.trim())) ||
                     (a2 && (Array.isArray(a2) ? a2.length : a2.trim()));
      if (!hasAny) return;

      const fmt = (val) => {
        if (!val) return '';
        if (Array.isArray(val)) return val.length ? val.join(' • ') : '';
        return val.trim();
      };

      html += `<div class="compare-question">
        <div class="compare-q-text">${qi + 1}. ${q.text}</div>
        <div class="compare-answers">
          <div class="answer-box person1">
            <div class="answer-name">${name1} 💙</div>
            <div class="answer-text">${fmt(a1) || '<span class="no-answer">لم يُجب بعد</span>'}</div>
          </div>
          <div class="answer-box person2">
            <div class="answer-name">${name2} 🌸</div>
            <div class="answer-text">${fmt(a2) || '<span class="no-answer">لم تُجب بعد</span>'}</div>
          </div>
        </div>
      </div>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}

// ===== VIEW SWITCH =====
async function switchView(view) {
  currentView = view;
  document.getElementById('toggle-fill').classList.toggle('active', view === 'fill');
  document.getElementById('toggle-compare').classList.toggle('active', view === 'compare');
  document.getElementById('fill-view').classList.toggle('hidden', view !== 'fill');
  document.getElementById('compare-view').classList.toggle('hidden', view !== 'compare');
  document.getElementById('save-section').style.display = view === 'fill' ? 'block' : 'none';

  if (view === 'compare') {
    showToast('⏳ جاري تحميل إجابات الطرفين...');
    const data = await cloudGet();
    if (data) {
      cachedAnswers.person1 = data.person1 || {};
      cachedAnswers.person2 = data.person2 || {};
    }
    renderCompareView();
  }
}

}

  const code = getBinShareCode();

  if (currentRole === 'person1') {
    // أيمن — يعرض الكود ليشاركه
    sec.innerHTML = `<div class="share-box">
      <h3>🔗 شارك هذا الكود مع لطيفة</h3>
      <div class="code-display" id="bin-code">${code || 'جاري الإنشاء...'}</div>
      <div class="share-actions">
        <button class="share-btn primary" onclick="copyCode()">📋 نسخ الكود</button>
      </div>
    </div>`;
  } else {
    // لطيفة — تدخل الكود
    sec.innerHTML = `<div class="share-box">
      <h3>🔗 أدخلي كود أيمن للتزامن</h3>
      ${code ? `<p style="font-size:13px;color:var(--green);margin-bottom:10px;">✅ متصلة بنفس قاعدة البيانات</p>` : ''}
      <div class="import-wrap visible">
        <label>الصق الكود الذي أرسله لك أيمن:</label>
        <div class="import-row">
          <input class="import-input" id="import-input" placeholder="الكود هنا...">
          <button class="share-btn primary" onclick="doImport()">ربط ✓</button>
        </div>
      </div>
    </div>`;
  }
}

function copyCode() {
  const code = getBinShareCode();
  navigator.clipboard.writeText(code).then(() => showToast('✅ تم نسخ الكود!'));
}

async function doImport() {
  const input = document.getElementById('import-input').value.trim();
  if (!input) { showToast('أدخلي الكود أولاً'); return; }
  showToast('⏳ جاري الربط...');
  const ok = await importBinCode(input);
  if (ok) {
    showToast('✅ تم الربط! إجاباتك ستتزامن مع أيمن');
    renderShareSection();
    // Reload answers
    const data = await cloudGet();
    if (data) {
      cachedAnswers.person1 = data.person1 || {};
      cachedAnswers.person2 = data.person2 || {};
    }
    renderFillView();
  } else {
    showToast('❌ الكود غير صحيح، حاولي مرة ثانية');
  }
}

// Init
document.getElementById('fill-view').innerHTML = `
  <div class="info-banner">
    اختر دورك في الأعلى للبدء في الإجابة على الأسئلة ✨
  </div>`;
</script>
</body>
</html>
