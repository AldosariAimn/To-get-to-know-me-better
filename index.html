<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حتى تعرفني أكثر 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6f0;
    --warm: #f5ede0;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --deep: #2c1f14;
    --mid: #6b4c35;
    --soft: #a07850;
    --rose: #d4846a;
    --green: #6a9e7a;
    --border: #e2d5c3;
    --blue: #6a8fa0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Tajawal', sans-serif;
    color: var(--deep);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 10% 20%, rgba(201,169,110,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(212,132,106,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 780px; margin: 0 auto; padding: 20px 16px 80px; position: relative; z-index: 1; }

  .header { text-align: center; padding: 48px 0 36px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
  .header-ornament { font-family: 'Amiri', serif; font-size: 28px; color: var(--gold); margin-bottom: 12px; letter-spacing: 8px; }
  .header h1 { font-size: 32px; font-weight: 800; color: var(--deep); line-height: 1.3; margin-bottom: 8px; }
  .header p { color: var(--soft); font-size: 15px; font-weight: 300; line-height: 1.7; }

  .role-section { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 28px; box-shadow: 0 2px 20px rgba(44,31,20,0.04); }
  .role-section h2 { font-size: 17px; font-weight: 700; color: var(--mid); margin-bottom: 20px; text-align: center; }
  .role-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .role-btn { padding: 14px 32px; border-radius: 50px; border: 2px solid var(--border); background: white; font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 600; color: var(--mid); cursor: pointer; transition: all 0.2s; }
  .role-btn:hover { border-color: var(--gold); color: var(--deep); }
  .role-btn.active { background: var(--deep); border-color: var(--deep); color: white; }

  .view-toggle { display: flex; gap: 8px; background: var(--warm); border-radius: 50px; padding: 4px; margin-bottom: 32px; width: fit-content; margin-inline: auto; flex-wrap: wrap; justify-content: center; }
  .toggle-btn { padding: 10px 20px; border-radius: 50px; border: none; background: transparent; font-family: 'Tajawal', sans-serif; font-size: 13px; font-weight: 600; color: var(--soft); cursor: pointer; transition: all 0.2s; }
  .toggle-btn.active { background: white; color: var(--deep); box-shadow: 0 2px 8px rgba(44,31,20,0.1); }

  .section-card { background: white; border: 1px solid var(--border); border-radius: 20px; margin-bottom: 24px; overflow: hidden; box-shadow: 0 2px 20px rgba(44,31,20,0.04); }
  .section-header { padding: 22px 28px; display: flex; align-items: center; gap: 14px; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
  .section-header.open { border-color: var(--border); }
  .section-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--warm); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .section-title { flex: 1; }
  .section-title h3 { font-size: 16px; font-weight: 700; color: var(--deep); }
  .section-title p { font-size: 12px; color: var(--soft); margin-top: 2px; }
  .section-progress { font-size: 12px; color: var(--gold); font-weight: 600; }
  .chevron { width: 20px; height: 20px; color: var(--soft); transition: transform 0.3s; }
  .section-header.open .chevron { transform: rotate(180deg); }
  .section-body { display: none; padding: 24px 28px; }
  .section-body.open { display: block; }

  .question { margin-bottom: 28px; }
  .question:last-child { margin-bottom: 0; }
  .question-label { font-size: 15px; font-weight: 600; color: var(--deep); margin-bottom: 10px; line-height: 1.6; display: flex; gap: 10px; }
  .question-sub { font-size: 13px; color: var(--soft); font-weight: 400; margin-bottom: 10px; margin-right: 36px; line-height: 1.6; }
  .question-num { width: 26px; height: 26px; background: var(--warm); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--soft); flex-shrink: 0; margin-top: 1px; }

  textarea { width: 100%; min-height: 90px; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 14px; font-family: 'Tajawal', sans-serif; font-size: 15px; color: var(--deep); background: var(--cream); resize: vertical; outline: none; transition: border-color 0.2s; line-height: 1.7; }
  textarea:focus { border-color: var(--gold); background: white; }

  /* Scale 1-5 */
  .scale-wrap { display: flex; flex-direction: column; gap: 8px; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); padding: 0 4px; }
  .scale-options { display: flex; gap: 8px; }
  .scale-btn { flex: 1; padding: 12px 4px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--cream); font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 700; color: var(--soft); cursor: pointer; transition: all 0.15s; text-align: center; }
  .scale-btn:hover { border-color: var(--gold-light); }
  .scale-btn.selected { background: var(--deep); border-color: var(--deep); color: white; }

  /* Checkbox */
  .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
  .checkbox-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.15s; background: var(--cream); }
  .checkbox-item:hover { border-color: var(--gold-light); background: white; }
  .checkbox-item.checked { border-color: var(--gold); background: #fdf8f0; }
  .checkmark { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 12px; }
  .checkbox-item.checked .checkmark { background: var(--gold); border-color: var(--gold); color: white; }
  .checkbox-item span { font-size: 14px; color: var(--deep); }

  .save-section { text-align: center; padding: 40px 0 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .save-btn { background: var(--deep); color: white; border: none; padding: 16px 48px; border-radius: 50px; font-family: 'Tajawal', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px rgba(44,31,20,0.2); }
  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(44,31,20,0.3); }

  .info-banner { background: #f0f7f2; border: 1px solid #b8d9c4; border-radius: 14px; padding: 16px 20px; font-size: 14px; color: #4a7a5a; margin-bottom: 28px; line-height: 1.7; text-align: center; }
  .warn-banner { background: #fff8f0; border: 1px solid #f5c6bc; border-radius: 14px; padding: 16px 20px; font-size: 14px; color: #c06040; margin-bottom: 28px; line-height: 1.7; text-align: center; }

  /* Share box */
  .share-box { background: white; border: 1.5px solid var(--gold-light); border-radius: 20px; padding: 24px 28px; box-shadow: 0 2px 20px rgba(44,31,20,0.04); margin-bottom: 28px; }
  .share-box h3 { font-size: 15px; font-weight: 700; color: var(--mid); margin-bottom: 14px; }
  .code-display { background: var(--warm); border-radius: 12px; padding: 14px 18px; font-family: monospace; font-size: 12px; color: var(--deep); word-break: break-all; margin-bottom: 12px; line-height: 1.6; }
  .share-btn { padding: 10px 20px; border-radius: 50px; border: 1.5px solid var(--border); background: white; font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 600; color: var(--mid); cursor: pointer; transition: all 0.2s; }
  .share-btn:hover { border-color: var(--gold); }
  .share-btn.primary { background: var(--deep); color: white; border-color: var(--deep); }
  .import-wrap { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .import-wrap label { font-size: 13px; color: var(--soft); display: block; margin-bottom: 8px; }
  .import-row { display: flex; gap: 8px; }
  .import-input { flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-family: monospace; font-size: 12px; color: var(--deep); background: var(--cream); outline: none; }
  .import-input:focus { border-color: var(--gold); }

  /* Compare */
  .compare-card { background: white; border: 1px solid var(--border); border-radius: 20px; margin-bottom: 24px; overflow: hidden; box-shadow: 0 2px 20px rgba(44,31,20,0.04); }
  .compare-section-title { padding: 18px 24px; background: var(--warm); font-size: 15px; font-weight: 700; color: var(--mid); display: flex; align-items: center; gap: 10px; }
  .compare-question { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  .compare-question:last-child { border-bottom: none; }
  .compare-q-text { font-size: 14px; font-weight: 700; color: var(--deep); margin-bottom: 14px; line-height: 1.6; }
  .compare-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answer-box { border-radius: 14px; padding: 14px; border: 1.5px solid; }
  .answer-box.person1 { border-color: #e8d5b0; background: #fdf8f0; }
  .answer-box.person2 { border-color: #f5c6bc; background: #fdf5f3; }
  .answer-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .answer-box.person1 .answer-name { color: var(--gold); }
  .answer-box.person2 .answer-name { color: var(--rose); }
  .answer-text { font-size: 14px; color: var(--deep); line-height: 1.7; white-space: pre-wrap; }
  .no-answer { color: var(--soft); font-style: italic; font-size: 13px; }

  /* Scale compare */
  .scale-compare { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .scale-bar-wrap { flex: 1; }
  .scale-bar { height: 8px; border-radius: 4px; margin-bottom: 4px; }
  .scale-bar.p1 { background: var(--gold); }
  .scale-bar.p2 { background: var(--rose); }
  .scale-val { font-size: 18px; font-weight: 800; }
  .scale-val.p1 { color: var(--gold); }
  .scale-val.p2 { color: var(--rose); }
  .diff-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 50px; }
  .diff-0 { background: #e8f5ee; color: #4a7a5a; }
  .diff-1 { background: #fdf8f0; color: #a07850; }
  .diff-2 { background: #fff0e8; color: #c06040; }
  .diff-3 { background: #ffe8e8; color: #a03030; }

  /* Analysis */
  .analysis-wrap { background: white; border: 1px solid var(--border); border-radius: 24px; padding: 32px 28px; margin-bottom: 24px; box-shadow: 0 4px 30px rgba(44,31,20,0.08); }
  .analysis-title { font-size: 20px; font-weight: 800; color: var(--deep); margin-bottom: 6px; text-align: center; }
  .analysis-sub { font-size: 14px; color: var(--soft); text-align: center; margin-bottom: 28px; }

  .score-circle-wrap { display: flex; justify-content: center; margin-bottom: 32px; }
  .score-circle { width: 160px; height: 160px; border-radius: 50%; border: 8px solid var(--warm); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .score-num { font-size: 48px; font-weight: 800; line-height: 1; }
  .score-label { font-size: 13px; color: var(--soft); margin-top: 4px; }
  .score-desc { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 24px; }

  .dimensions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  .dim-card { border-radius: 16px; padding: 16px; border: 1.5px solid var(--border); }
  .dim-icon { font-size: 22px; margin-bottom: 8px; }
  .dim-name { font-size: 13px; font-weight: 700; color: var(--deep); margin-bottom: 6px; }
  .dim-bar-bg { height: 8px; background: var(--warm); border-radius: 4px; overflow: hidden; }
  .dim-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
  .dim-score { font-size: 12px; color: var(--soft); margin-top: 4px; }

  .analysis-section { margin-bottom: 24px; }
  .analysis-section h3 { font-size: 15px; font-weight: 700; color: var(--mid); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .strength-item, .growth-item { padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.6; }
  .strength-item { background: #f0f7f2; border: 1px solid #b8d9c4; color: #2a5a3a; }
  .growth-item { background: #fff8f0; border: 1px solid #f5d5b0; color: #7a4a20; }

  .couple-type { text-align: center; padding: 20px; background: var(--warm); border-radius: 16px; margin-bottom: 24px; }
  .couple-type-badge { display: inline-block; background: var(--deep); color: white; font-size: 16px; font-weight: 700; padding: 8px 24px; border-radius: 50px; margin-bottom: 8px; }
  .couple-type p { font-size: 14px; color: var(--mid); line-height: 1.7; }

  .advice-tip { background: white; border-radius: 12px; padding: 14px 16px; border: 1px solid rgba(0,0,0,0.06); }
  .advice-tip-title { font-size: 14px; font-weight: 700; color: var(--deep); margin-bottom: 6px; }
  .advice-tip-body { font-size: 13px; color: var(--mid); line-height: 1.8; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--deep); color: white; padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: 600; z-index: 1000; transition: transform 0.3s ease; text-align: center; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }

  @media (max-width: 540px) {
    .compare-answers { grid-template-columns: 1fr; }
    .dimensions-grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 26px; }
    .section-header { padding: 18px 20px; }
    .section-body { padding: 18px 20px; }
    .score-circle { width: 130px; height: 130px; }
    .score-num { font-size: 38px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-ornament">❧ ✦ ❧</div>
    <h1>حتى تعرفني أكثر 💛</h1>
    <p>أسئلة مبنية على أبحاث علم النفس في العلاقات الزوجية<br>أجب بصدق — ما في إجابة صح أو غلط</p>
  </div>

  <div class="role-section">
    <h2>أنت من؟</h2>
    <div class="role-buttons">
      <button class="role-btn" onclick="selectRole('person1')" id="btn-p1">A 💙</button>
      <button class="role-btn" onclick="selectRole('person2')" id="btn-p2">L 🌸</button>
    </div>
  </div>

  <div id="share-section"></div>

  <div class="view-toggle hidden" id="view-toggle">
    <button class="toggle-btn active" onclick="switchView('fill')" id="toggle-fill">أجاوب ✏️</button>
    <button class="toggle-btn" onclick="switchView('compare')" id="toggle-compare">نقارن 👀</button>
    <button class="toggle-btn" onclick="switchView('analysis')" id="toggle-analysis">التحليل 📊</button>
  </div>

  <div id="fill-view">
    <div class="info-banner">اختر دورك للبدء ✨</div>
  </div>
  <div id="compare-view" class="hidden"></div>
  <div id="analysis-view" class="hidden"></div>

  <div class="save-section hidden" id="save-section">
    <button class="save-btn" onclick="saveAnswers()">💾 حفظ إجاباتي</button>
    <button class="save-btn" onclick="resetAnswers()" style="background:white;color:#d4846a;border:2px solid #d4846a;font-size:15px;padding:12px 32px;">🗑 مسح إجاباتي</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================
// SECTIONS & QUESTIONS
// =====================
const sections = [
  {
    id: 'attachment',
    icon: '🔗',
    title: 'نمط التعلق العاطفي',
    desc: 'كيف تحب وكيف تحتاج أن تُحَب — مبني على نظرية التعلق',
    scoreKey: 'attachment',
    questions: [
      {
        id: 'at1', type: 'scale',
        text: 'لما أحس بضغط أو قلق، أول شيء أبغاه من شريكي هو:',
        sub: null,
        scaleMin: 'أكون لوحدي وأعالج الموضوع بنفسي',
        scaleMax: 'أبغاه/ها قريب مني يسمعني'
      },
      {
        id: 'at2', type: 'scale',
        text: 'لما يكون شريكي مشغول وما أقدر أوصل له/لها لفترة، أحس:',
        sub: null,
        scaleMin: 'مرتاح، أثق إنه/ها بخير',
        scaleMax: 'أحتاج أتأكد إنه/ها بخير وما صار شيء'
      },
      {
        id: 'at3', type: 'text',
        text: 'وصّف كيف تتصرف لما تحتاج دعم من شريكك — هل تطلب مباشرة أم تنتظر هو/هي يلاحظ؟',
        sub: 'كن صريح، ما في إجابة خطأ'
      },
      {
        id: 'at4', type: 'scale',
        text: 'مدى راحتك في إظهار ضعفك أو خوفك أمام شريكك:',
        scaleMin: 'صعب عليّ جداً',
        scaleMax: 'أقدر بكل راحة'
      },
      {
        id: 'at5', type: 'text',
        text: 'إيش اللي يخليك تحس بالأمان الحقيقي مع أي شخص تثق به؟ وكيف تتمنى تحس مع شريكك؟',
        sub: null
      }
    ]
  },
  {
    id: 'love',
    icon: '💛',
    title: 'لغة الحب والتعبير عنه',
    desc: 'كيف تعطي الحب وكيف تحتاج تستقبله — Gary Chapman',
    scoreKey: 'love',
    questions: [
      {
        id: 'lv1', type: 'checkbox',
        text: 'أكثر شيء يخليني أحس أني محبوب/ة ومهتم به/ها هو:',
        sub: 'اختر الأهم لك',
        options: ['كلام تشجيعي وثناء صادق', 'وقت جيد نقضيه مع بعض بدون شاشات', 'مساعدة عملية تخفف عليّ', 'لمسة حنونة أو قرب جسدي', 'هدية مفاجئة ولو صغيرة']
      },
      {
        id: 'lv2', type: 'checkbox',
        text: 'وأنا أعبّر عن حبي، أكثر شيء أفعله طبيعياً هو:',
        sub: null,
        options: ['أقول كلام حلو أو أثني عليه/ها', 'أخصص وقت له/لها فقط', 'أساعد وأتصرف بدون ما يطلب', 'أقرّب منه/ها وألمس يده/ها', 'أفكر في هدايا أو مفاجآت']
      },
      {
        id: 'lv3', type: 'text',
        text: 'كيف تحب الطرف الثاني يُظهر اهتمامه بك في الحياة اليومية؟ أعطِ أمثلة من تصورك.',
        sub: null
      },
      {
        id: 'lv4', type: 'text',
        text: 'إيش اللي تتمنى شريكك يعرفه عن طريقتك في استقبال الاهتمام — شيء ما قلته له/لها بعد؟',
        sub: 'هذا سؤال مهم جداً — كن صريح'
      },
      {
        id: 'lv5', type: 'scale',
        text: 'مدى إحساسك بالارتياح والقبول مع شريكك حتى الآن:',
        scaleMin: 'ما زلت أتعرف عليه/ها',
        scaleMax: 'أحس براحة كبيرة معه/ها'
      }
    ]
  },
  {
    id: 'communication',
    icon: '💬',
    title: 'طريقة التواصل وحل الخلاف',
    desc: 'مبني على أبحاث Gottman — أهم عامل في نجاح الزواج',
    scoreKey: 'communication',
    questions: [
      {
        id: 'cm1', type: 'checkbox',
        text: 'لما يكون بيني وبين شريكي خلاف، أكثر شيء أميل له هو:',
        sub: null,
        options: ['أتكلم فوراً وأعبّر عن إحساسي', 'أسكت وأحتاج وقت قبل أتكلم', 'أبتعد مؤقتاً وأعود لما أهدأ', 'أحاول أقلل الموضوع وأتجاوز', 'أنتظر الطرف الثاني يبدأ']
      },
      {
        id: 'cm2', type: 'scale',
        text: 'مدى سهولة قول "أنا غلطت وأعتذر" لشريكك:',
        scaleMin: 'صعب جداً عليّ',
        scaleMax: 'سهل وطبيعي'
      },
      {
        id: 'cm3', type: 'text',
        text: 'لو حصل خلاف بينكما — كيف تتخيل تتصرف؟ وكيف تتمنى ينتهي؟',
        sub: 'تكلم عن توقعك لا عن تجربة سابقة'
      },
      {
        id: 'cm4', type: 'scale',
        text: 'مدى إحساسك بأن شريكك يفهم طريقة تفكيرك حتى الآن:',
        scaleMin: 'ما زلنا نتعرف على بعض',
        scaleMax: 'يفهمني بشكل جيد'
      },

// =====================
// JSONBIN STORAGE
// =====================
const JSONBIN_KEY = '$2a$10$djAP1AYEicaZLWkdTTlzz.t0mj5rlzlKvaMugu0Fi82lNz7O/Uj7W';
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';
let binId = null;
let cachedAnswers = { person1: {}, person2: {} };
let currentRole = null;
let currentView = 'fill';

async function ensureBin() {
  if (binId) return binId;
  binId = localStorage.getItem('questionnaire_bin_id');
  if (binId) return binId;
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Name': 'questionnaire-v2', 'X-Bin-Private': 'true' },
      body: JSON.stringify({ person1: {}, person2: {} })
    });
    const data = await res.json();
    binId = data.metadata.id;
    localStorage.setItem('questionnaire_bin_id', binId);
    return binId;
  } catch { return null; }
}

async function cloudGet() {
  try {
    const id = await ensureBin();
    if (!id) return null;
    const res = await fetch(`${JSONBIN_URL}/${id}/latest`, { headers: { 'X-Master-Key': JSONBIN_KEY } });
    const data = await res.json();
    return data.record || null;
  } catch { return null; }
}

async function cloudSet(role, answers) {
  try {
    const id = await ensureBin();
    if (!id) return;
    const current = await cloudGet() || { person1: {}, person2: {} };
    current[role] = answers;
    await fetch(`${JSONBIN_URL}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(current)
    });
  } catch {}
}

function getBinShareCode() { return localStorage.getItem('questionnaire_bin_id') || ''; }

async function importBinCode(code) {
  const clean = code.trim();
  if (!clean) return false;
  try {
    const res = await fetch(`${JSONBIN_URL}/${clean}/latest`, { headers: { 'X-Master-Key': JSONBIN_KEY } });
    if (!res.ok) return false;
    binId = clean;
    localStorage.setItem('questionnaire_bin_id', clean);
    return true;
  } catch { return false; }
}

// ROLE & LOAD
// =====================
async function selectRole(role) {
  currentRole = role;
  document.getElementById('btn-p1').classList.toggle('active', role === 'person1');
  document.getElementById('btn-p2').classList.toggle('active', role === 'person2');
  showToast('⏳ جاري التحميل...');
  const data = await cloudGet();
  if (data) { cachedAnswers.person1 = data.person1 || {}; cachedAnswers.person2 = data.person2 || {}; }
  showToast('✅ جاهز');
  document.getElementById('view-toggle').classList.remove('hidden');
  document.getElementById('save-section').classList.remove('hidden');
  renderShareSection();
  renderFillView();
}

// =====================
// SHARE SECTION
// =====================
function renderShareSection() {
  const sec = document.getElementById('share-section');
  const code = getBinShareCode();
  if (currentRole === 'person1') {
    sec.innerHTML = `<div class="share-box">
      <h3>🔗 شارك هذا الكود مع شريكك</h3>
      <div class="code-display" id="bin-code">${code || 'جاري الإنشاء...'}</div>
      <button class="share-btn primary" onclick="copyCode()">📋 نسخ الكود</button>
    </div>`;
  } else {
    sec.innerHTML = `<div class="share-box">
      <h3>🔗 أدخلي كود شريكك للتزامن</h3>
      ${code ? '<p style="font-size:13px;color:#4a7a5a;margin-bottom:10px;">✅ متصلة بنفس قاعدة البيانات</p>' : ''}
      <div class="import-wrap">
        <label>الصق الكود هنا:</label>
        <div class="import-row">
          <input class="import-input" id="import-input" placeholder="الكود...">
          <button class="share-btn primary" onclick="doImport()">ربط ✓</button>
        </div>
      </div>
    </div>`;
  }
}

function copyCode() {
  navigator.clipboard.writeText(getBinShareCode()).then(() => showToast('✅ تم نسخ الكود!'));
}

async function doImport() {
  const input = document.getElementById('import-input').value.trim();
  if (!input) { showToast('أدخلي الكود أولاً'); return; }
  showToast('⏳ جاري الربط...');
  const ok = await importBinCode(input);
  if (ok) {
    showToast('✅ تم الربط!');
    renderShareSection();
    const data = await cloudGet();
    if (data) { cachedAnswers.person1 = data.person1 || {}; cachedAnswers.person2 = data.person2 || {}; }
    renderFillView();
  } else { showToast('❌ كود غير صحيح'); }
}

// =====================
// FILL VIEW
// =====================
function renderFillView() {
  const container = document.getElementById('fill-view');
  if (!currentRole) return;
  const saved = cachedAnswers[currentRole] || {};
  let html = `<div class="info-banner">أجب بصدق واضغط حفظ 🌿<br><small>إجاباتك تُحفظ في السحابة ويقدر شريكك يشوفها من جهازه</small></div>`;

  sections.forEach((sec, si) => {
    const answered = sec.questions.filter(q => {
      const a = saved[q.id];
      return a && (Array.isArray(a) ? a.length > 0 : (typeof a === 'number' || a.trim().length > 0));
    }).length;

    html += `<div class="section-card">
      <div class="section-header" onclick="toggleSection('sec${si}')" id="sh_sec${si}">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-title"><h3>${sec.title}</h3><p>${sec.desc}</p></div>
        <span class="section-progress">${answered}/${sec.questions.length}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>
      </div>
      <div class="section-body" id="sec${si}">`;

    sec.questions.forEach((q, qi) => {
      const val = saved[q.id];
      html += `<div class="question"><div class="question-label"><div class="question-num">${qi+1}</div><span>${q.text}</span></div>`;
      if (q.sub) html += `<div class="question-sub">${q.sub}</div>`;

      if (q.type === 'scale') {
        html += `<div class="scale-wrap">
          <div class="scale-labels"><span>${q.scaleMin}</span><span>${q.scaleMax}</span></div>
          <div class="scale-options">`;
        for (let i = 1; i <= 5; i++) {
          html += `<button class="scale-btn${val === i ? ' selected' : ''}" data-qid="${q.id}" data-val="${i}" onclick="setScale(this)">${i}</button>`;
        }
        html += `</div></div>`;
      } else if (q.type === 'checkbox') {
        html += `<div class="checkbox-group">`;
        q.options.forEach(opt => {
          const checked = val && val.includes(opt);
          html += `<label class="checkbox-item${checked ? ' checked' : ''}" data-qid="${q.id}" data-option="${opt}" onclick="toggleCheck(this)">
            <div class="checkmark">${checked ? '✓' : ''}</div><span>${opt}</span></label>`;
        });
        html += `</div>`;
      } else {
        html += `<textarea id="ans_${q.id}" placeholder="اكتب هنا...">${val || ''}</textarea>`;
      }
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

function toggleSection(id) {
  const body = document.getElementById(id);
  const header = document.getElementById('sh_' + id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  header.classList.toggle('open', !isOpen);
}

function setScale(btn) {
  btn.closest('.scale-options').querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function toggleCheck(el) {
  el.classList.toggle('checked');
  el.querySelector('.checkmark').textContent = el.classList.contains('checked') ? '✓' : '';
}

async function saveAnswers() {
  if (!currentRole) { showToast('اختر دورك أولاً'); return; }
  showToast('⏳ جاري الحفظ...');
  const answers = {};
  sections.forEach(sec => {
    sec.questions.forEach(q => {
      if (q.type === 'scale') {
        const selected = document.querySelector(`.scale-btn.selected[data-qid="${q.id}"]`);
        if (selected) answers[q.id] = parseInt(selected.dataset.val);
      } else if (q.type === 'checkbox') {
        const checked = [];
        document.querySelectorAll(`[data-qid="${q.id}"].checked`).forEach(el => checked.push(el.dataset.option));
        if (checked.length) answers[q.id] = checked;
      } else {
        const el = document.getElementById('ans_' + q.id);
        if (el && el.value.trim()) answers[q.id] = el.value;
      }
    });
  });
  await cloudSet(currentRole, answers);
  cachedAnswers[currentRole] = answers;
  renderFillView();
  showToast('✅ تم الحفظ!');
}

async function resetAnswers() {
  if (!currentRole) return;
  if (!confirm('هل أنت متأكد أنك تريد مسح إجاباتك؟')) return;
  showToast('⏳ جاري المسح...');
  await cloudSet(currentRole, {});
  cachedAnswers[currentRole] = {};
  renderFillView();
  showToast('✅ تم المسح');
}

// COMPARE VIEW
// =====================
function renderCompareView() {
  const container = document.getElementById('compare-view');
  const a1 = cachedAnswers.person1 || {};
  const a2 = cachedAnswers.person2 || {};
  const has1 = Object.keys(a1).length > 0;
  const has2 = Object.keys(a2).length > 0;

  if (!has1 && !has2) {
    container.innerHTML = `<div class="warn-banner">لم يُجب أحد بعد — يجب أن تحفظ الإجابات أولاً</div>`;
    return;
  }

  let html = `<div class="info-banner">
    <span style="background:var(--gold);color:white;padding:2px 12px;border-radius:50px;font-size:12px;font-weight:700;">${has1 ? '✓' : '○'} A</span>
    &nbsp;
    <span style="background:#d4846a;color:white;padding:2px 12px;border-radius:50px;font-size:12px;font-weight:700;">${has2 ? '✓' : '○'} Aة</span>
    <br>ناقشا الفروقات بهدوء وفضول 💬
  </div>`;

  sections.forEach(sec => {
    let secHtml = '';
    sec.questions.forEach((q, qi) => {
      const v1 = a1[q.id], v2 = a2[q.id];
      if (!v1 && !v2) return;

      const fmt = (v) => {
        if (!v) return '';
        if (Array.isArray(v)) return v.join(' • ');
        if (typeof v === 'number') return v.toString();
        return v.trim();
      };

      let answerHtml = '';
      if (q.type === 'scale' && typeof v1 === 'number' && typeof v2 === 'number') {
        const diff = Math.abs(v1 - v2);
        const diffClass = diff === 0 ? 'diff-0' : diff === 1 ? 'diff-1' : diff === 2 ? 'diff-2' : 'diff-3';
        const diffLabel = diff === 0 ? 'متطابق ✓' : diff === 1 ? 'قريب' : diff === 2 ? 'فرق ملحوظ' : 'فرق كبير';
        answerHtml = `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="scale-val p1">${v1 || '—'}</span>
            <div style="font-size:12px;color:var(--gold);">A</div>
          </div>
          <span class="diff-badge ${diffClass}">${diffLabel}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="font-size:12px;color:var(--rose);">L</div>
            <span class="scale-val p2">${v2 || '—'}</span>
          </div>
        </div>`;
      } else {
        answerHtml = `<div class="compare-answers">
          <div class="answer-box person1">
            <div class="answer-name">A 💙</div>
            <div class="answer-text">${fmt(v1) || '<span class="no-answer">لم يجب بعد</span>'}</div>
          </div>
          <div class="answer-box person2">
            <div class="answer-name">L 🌸</div>
            <div class="answer-text">${fmt(v2) || '<span class="no-answer">لم تجب بعد</span>'}</div>
          </div>
        </div>`;
      }

      secHtml += `<div class="compare-question">
        <div class="compare-q-text">${qi+1}. ${q.text}</div>
        ${answerHtml}
      </div>`;
    });

    if (secHtml) {
      html += `<div class="compare-card">
        <div class="compare-section-title">${sec.icon} ${sec.title}</div>
        ${secHtml}
      </div>`;
    }
  });

  container.innerHTML = html;
}

function calcScore(a1, a2) {
  const dimensions = {};
  let totalMatch = 0, totalScaleQ = 0;

  sections.forEach(sec => {
    let secMatch = 0, secTotal = 0;
    sec.questions.forEach(q => {
      const v1 = a1[q.id], v2 = a2[q.id];
      if (q.type === 'scale' && typeof v1 === 'number' && typeof v2 === 'number') {
        const diff = Math.abs(v1 - v2);
        const match = Math.max(0, (4 - diff) / 4);
        secMatch += match;
        secTotal++;
        totalMatch += match;
        totalScaleQ++;
      }
    });
    dimensions[sec.id] = secTotal > 0 ? Math.round((secMatch / secTotal) * 100) : null;
  });

  const overall = totalScaleQ > 0 ? Math.round((totalMatch / totalScaleQ) * 100) : null;
  return { overall, dimensions };
}

function getCoupleType(score) {
  if (score >= 80) return { type: 'المتناغمان ✨', color: '#4a7a5a', desc: 'توافقكم عالٍ جداً في القيم والأولويات. هذا لا يعني غياب الخلافات — بل يعني أن عندكم أساس قوي لبناء عليه.' };
  if (score >= 65) return { type: 'المتوازنان 🌿', color: '#6a8fa0', desc: 'عندكم توافق جيد في معظم المجالات مع بعض الفروقات الطبيعية التي يمكن التعامل معها بالحوار.' };
  if (score >= 50) return { type: 'المكتشفان 🔍', color: '#a07850', desc: 'عندكم نقاط قوة وفروقات تستحق النقاش. الفروقات ليست عائقاً — بل فرصة لفهم بعض أعمق.' };
  return { type: 'المتباينان 🌊', color: '#c06040', desc: 'هناك فروقات جوهرية تحتاج نقاشاً صريحاً وعميقاً قبل الزواج. هذا ليس حكماً — بل تنبيه مهم.' };
}

      { title: 'البرود الدوري طبيعي جداً', body: 'كل علاقة تمر بدورات — قرب وبُعد، حماس وروتين. الخطأ هو تفسير البُعد الطبيعي كمشكلة. الأزواج الناجحون يعرفون أن هذا موسم لا نهاية.' },
      { title: 'تمرين "رسالة التوقعات"', body: 'كل واحد يكتب: "أنا أتوقع من شريكي في الزواج..." ثم تتبادلوا الرسائل. هذا التمرين وحده يكشف فروقات كانت ستظهر بعد سنوات على شكل خيبات.' }
    ]
  },
  growth: {
    title: 'النمو الشخصي والصداقة',
    icon: '🌿',
    why: 'Gottman يقول: "الصداقة هي أساس الزواج الرومانسي الناجح" — والأزواج الذين يصفون شريكهم كأفضل صديق لديهم رضا زوجي أعلى بمرتين.',
    tips: [
      { title: 'كونوا فضوليين على بعض دائماً', body: 'الخطأ الأكبر في الزواج هو الاعتقاد بأنك "تعرف" شريكك تماماً. الناس تتغير — اسأل، اكتشف، انبهر من جديد.' },
      { title: 'ادعموا أحلام بعض حتى لو ما فهمتوها', body: 'بحث Gottman: الأزواج الذين يدعمون أحلام بعض — حتى الأحلام الغريبة — يتمتعون برضا أعلى بكثير. الدعم لا يعني الاتفاق.' },
      { title: 'خصصوا وقتاً للصداقة لا فقط للإدارة', body: 'معظم الأزواج يتكلمون فقط عن اللوجستيات — أكل، أطفال، مواعيد. خصصوا وقتاً تتكلمون فيه كأصدقاء: أحلام، ذكريات، ضحكات.' },
      { title: 'احتفلوا بنجاحات بعض', body: 'بحث Shelly Gable: طريقة تفاعل الزوج مع الأخبار الجيدة لشريكه أهم من تعاطفه مع الأخبار السيئة. افرح لشريكك بحماس حقيقي.' }
    ]
  }
};

function buildAdvice(overall, dimensions) {
  // Find weak areas (score < 65)
  const weakAreas = sections
    .filter(sec => dimensions[sec.id] !== null && dimensions[sec.id] < 65)
    .sort((a, b) => dimensions[a.id] - dimensions[b.id]);

  if (weakAreas.length === 0 && overall >= 80) {
    // High overall — give general maintenance tips
    return `<div class="analysis-wrap" style="margin-top:24px;">
      <div class="analysis-title" style="font-size:17px;">🌟 نصائح للحفاظ على ما بنيتموه</div>
      <div class="analysis-sub">توافقكم ممتاز — هذه النصائح تُبقيه كذلك</div>
      <div class="advice-tip">
        <div class="advice-tip-title">💬 لا تتوقفوا عن التعرف على بعض</div>
        <div class="advice-tip-body">الزواج الناجح ليس وجهة — هو رحلة مستمرة. استمروا في طرح الأسئلة العميقة وإن كنتم تعتقدون أنكم تعرفون الإجابات. الناس تتغير.</div>
      </div>
      <div class="advice-tip">
        <div class="advice-tip-title">🔁 قاعدة الـ 5:1 من Gottman</div>
        <div class="advice-tip-body">حافظوا على نسبة 5 تفاعلات إيجابية مقابل كل تفاعل سلبي — هذه القاعدة هي ما يميّز الأزواج السعداء في أبحاث Gottman على مدى 40 سنة.</div>
      </div>
      <div class="advice-tip">
        <div class="advice-tip-title">📅 موعد أسبوعي ثابت</div>
        <div class="advice-tip-body">بحث Gottman أثبت أن الأزواج الذين يخصصون وقتاً أسبوعياً ثابتاً لبعض — بعيداً عن الأطفال والهاتف — يُحافظون على مستوى الرضا حتى في سنوات الضغط.</div>
      </div>
    </div>`;
  }

  let html = `<div class="analysis-wrap" style="margin-top:24px;">
    <div class="analysis-title" style="font-size:17px;">🛠 كيف تعملون على نقاط الضعف؟</div>
    <div class="analysis-sub">نصائح مبنية على الأبحاث — خصيصاً لنتيجتكم</div>`;

  // General intro based on overall score
  if (overall < 50) {
    html += `<div style="background:#fff0e8;border:1px solid #f5c6a0;border-radius:14px;padding:16px;margin-bottom:24px;font-size:14px;color:#7a3a10;line-height:1.8;">
      <strong>ملاحظة مهمة:</strong> وجود فروقات كبيرة قبل الزواج ليس نهاية الطريق — لكنه إشارة واضحة أن هناك محادثات جوهرية يجب أن تحدث <strong>قبل</strong> الزواج لا بعده. الصراحة الآن أرحم من المفاجأة لاحقاً.
    </div>`;
  } else if (overall < 65) {
    html += `<div style="background:#fdf8f0;border:1px solid #e8d5b0;border-radius:14px;padding:16px;margin-bottom:24px;font-size:14px;color:#6b4c35;line-height:1.8;">
      الفروقات التي ظهرت طبيعية وقابلة للتعامل معها — لكنها تحتاج <strong>نقاشاً صادقاً وصبراً</strong>. الأزواج الذين يعملون على هذه المجالات قبل الزواج يُوفّرون على أنفسهم سنوات من سوء الفهم.
    </div>`;
  }

  weakAreas.slice(0, 4).forEach(sec => {
    const advice = adviceDB[sec.id];
    if (!advice) return;
    const score = dimensions[sec.id];
    const urgency = score < 45 ? '#ffe8e8' : '#fff8f0';
    const urgencyBorder = score < 45 ? '#f5b0b0' : '#f5d5b0';

    html += `<div style="border:1.5px solid ${urgencyBorder};background:${urgency};border-radius:18px;padding:20px 22px;margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
        <span style="font-size:22px;">${advice.icon}</span>
        <span style="font-size:16px;font-weight:800;color:var(--deep);">${advice.title}</span>
        <span style="margin-right:auto;font-size:12px;font-weight:700;background:white;padding:3px 10px;border-radius:50px;color:${score < 45 ? '#c06040' : '#a07850'};">${score}%</span>
      </div>
      <div style="font-size:13px;color:var(--soft);margin-bottom:14px;line-height:1.7;border-right:3px solid ${urgencyBorder};padding-right:10px;">
        📖 <em>${advice.why}</em>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">`;

    advice.tips.forEach(tip => {
      html += `<div class="advice-tip">
        <div class="advice-tip-title">✦ ${tip.title}</div>
        <div class="advice-tip-body">${tip.body}</div>
      </div>`;
    });

    html += `</div></div>`;
  });

  html += `</div>`;
  return html;
}

function renderAnalysisView() {
  const container = document.getElementById('analysis-view');
  const a1 = cachedAnswers.person1 || {};
  const a2 = cachedAnswers.person2 || {};
  const has1 = Object.keys(a1).length > 0;
  const has2 = Object.keys(a2).length > 0;

  if (!has1 || !has2) {
    container.innerHTML = `<div class="warn-banner">يجب أن يُجيب الطرفان ويحفظا إجاباتهما أولاً لعرض التحليل</div>`;
    return;
  }

  const { overall, dimensions } = calcScore(a1, a2);

  if (overall === null) {
    container.innerHTML = `<div class="warn-banner">يجب الإجابة على أسئلة المقياس (1-5) لحساب نسبة التوافق</div>`;
    return;
  }

  const couple = getCoupleType(overall);
  const scoreColor = overall >= 80 ? '#4a7a5a' : overall >= 65 ? '#6a8fa0' : overall >= 50 ? '#a07850' : '#c06040';

  // Strengths & growth
  const strengths = [], growth = [];
  sections.forEach(sec => {
    const d = dimensions[sec.id];
    if (d === null) return;
    if (d >= 75) strengths.push({ icon: sec.icon, name: sec.title, score: d });
    else if (d < 60) growth.push({ icon: sec.icon, name: sec.title, score: d });
  });

  // Open answers highlights
  const openHighlights = [];
  const importantOpen = ['at5', 'lv4', 'cm5', 'vl6', 'fm5', 'gr5'];
  importantOpen.forEach(qid => {
    const sec = sections.find(s => s.questions.find(q => q.id === qid));
    const q = sec?.questions.find(q => q.id === qid);
    const v1 = a1[qid], v2 = a2[qid];
    if (q && (v1 || v2)) openHighlights.push({ q, v1, v2, secIcon: sec.icon });
  });

  let html = `<div class="analysis-wrap">
    <div class="analysis-title">تحليل التوافق 📊</div>
    <div class="analysis-sub">مبني على أبحاث PREPARE/ENRICH و Gottman Institute</div>

    <div class="score-circle-wrap">
      <div class="score-circle" style="border-color:${scoreColor}20;">
        <div class="score-num" style="color:${scoreColor}">${overall}%</div>
        <div class="score-label">نسبة التوافق</div>
      </div>
    </div>

    <div class="couple-type">
      <div class="couple-type-badge" style="background:${couple.color}">${couple.type}</div>
      <p>${couple.desc}</p>
    </div>

    <div class="dimensions-grid">`;

  sections.forEach(sec => {
    const d = dimensions[sec.id];
    if (d === null) return;
    const barColor = d >= 75 ? '#6a9e7a' : d >= 55 ? '#c9a96e' : '#d4846a';
    html += `<div class="dim-card">
      <div class="dim-icon">${sec.icon}</div>
      <div class="dim-name">${sec.title}</div>
      <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${d}%;background:${barColor}"></div></div>
      <div class="dim-score">${d}%</div>
    </div>`;
  });

  html += `</div>`;

  if (strengths.length > 0) {
    html += `<div class="analysis-section">
      <h3>💪 نقاط قوتكم معاً</h3>`;
    strengths.forEach(s => {
      html += `<div class="strength-item">${s.icon} <strong>${s.name}</strong> — توافقكم فيه ممتاز (${s.score}%)</div>`;
    });
    html += `</div>`;
  }

  if (growth.length > 0) {
    html += `<div class="analysis-section">
      <h3>🌱 مجالات تحتاج نقاشاً أعمق</h3>`;
    growth.forEach(g => {
      html += `<div class="growth-item">${g.icon} <strong>${g.name}</strong> — فيه فروقات تستحق الحوار (${g.score}%)</div>`;
    });
    html += `</div>`;
  }

  if (openHighlights.length > 0) {
    html += `<div class="analysis-section">
      <h3>💬 إجابات تستحق نقاشاً</h3>
      <p style="font-size:13px;color:var(--soft);margin-bottom:12px;">هذه أهم الأسئلة المفتوحة التي تكشف الفكر العميق لكل طرف:</p>`;
    openHighlights.forEach(item => {
      if (!item.v1 && !item.v2) return;
      html += `<div style="margin-bottom:20px;">
        <div style="font-size:14px;font-weight:700;color:var(--deep);margin-bottom:10px;">${item.secIcon} ${item.q.text}</div>
        <div class="compare-answers">
          <div class="answer-box person1"><div class="answer-name">A 💙</div><div class="answer-text">${item.v1 || '<span class="no-answer">—</span>'}</div></div>
          <div class="answer-box person2"><div class="answer-name">L 🌸</div><div class="answer-text">${item.v2 || '<span class="no-answer">—</span>'}</div></div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // ---- ADVICE SECTION ----
  html += buildAdvice(overall, dimensions);

  html += `<div style="background:var(--warm);border-radius:14px;padding:16px;margin-top:8px;">
    <p style="font-size:13px;color:var(--mid);line-height:1.8;text-align:center;">
      ⚠️ هذا التحليل أداة للنقاش والفهم — وليس حكماً نهائياً على علاقتكم.<br>
      كل زواج ناجح يُبنى على الحوار الصادق والنية الصادقة.
    </p>
  </div>`;

  html += `</div>`;
  container.innerHTML = html;
}

// =====================
// VIEW SWITCH
// =====================
async function switchView(view) {
  currentView = view;
  ['fill','compare','analysis'].forEach(v => {
    document.getElementById(v + '-view').classList.toggle('hidden', v !== view);
    document.getElementById('toggle-' + v).classList.toggle('active', v === view);
  });
  document.getElementById('save-section').classList.toggle('hidden', view !== 'fill');

  if (view === 'compare' || view === 'analysis') {
    showToast('⏳ جاري التحميل...');
    const data = await cloudGet();
    if (data) { cachedAnswers.person1 = data.person1 || {}; cachedAnswers.person2 = data.person2 || {}; }
    if (view === 'compare') renderCompareView();
    else renderAnalysisView();
  }
}

// =====================
// TOAST
// =====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
